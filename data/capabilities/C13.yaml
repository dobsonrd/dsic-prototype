          role: "Health or Care Professional"
          want: "view Proxy Citizen Service usage"
          so_that: "I can see a Proxy's activity on Citizen Services on behalf of a Patient"
        acceptance_criteria:
          - id: AC1
            title: "view Proxy Citizen Service usage"
            given: "the Health or Care Professional is permitted to view Proxy Citizen Services usage"
            when: "the Health or Care Professional selects to view a Proxy's Citizen Services usage"
            then: ["the Proxy's Citizen Services usage is displayed"]
        supporting_info: >
          Examples of Proxy Citizen Services usage MAY include, but are not limited to:
          Proxy views of a Patient's Record; Proxy management of a Patient's Appointments
          on behalf of the Patient; Proxy Prescription Ordering on behalf of the Patient.

      - id: E00754
        title: "view Patient Citizen Service usage"
        user_story:
          role: "Health or Care Professional"
          want: "view Patient Citizen Service usage"
          so_that: "I can see a Patient's activity on Citizen Services"
        acceptance_criteria:
          - id: AC1
            title: "view Patient Citizen Service usage"
            given: "the Health or Care Professional is permitted to view Patient Citizen Services usage"
            when: "the Health or Care Professional selects to view a Patient's Citizen Services usage"
            then: ["the Patient's Citizen Services usage is displayed"]
        supporting_info: >
          Examples of Patient Citizen Services usage MAY include, but are not limited to:
          Views of a Patient's Record; Management of a Patient's Appointments; Prescription Ordering.

      - id: E00211
        title: "manage Acute Prescription Request Citizen Service for a Proxy"
        user_story:
          role: "Health or Care Professional"
          want: "manage Proxy access to the Acute Prescription Request Citizen Service"
          so_that: "I can manage Proxy access to the Acute Prescription Request Citizen Service"
        acceptance_criteria:
          - id: AC1
            title: "enable Proxy access to the Acute Prescription Request Citizen Service"
            given: "the Health or Care Professional is permitted to configure access to Citizen Services"
            when: "they select to enable Proxy access to the Acute Prescription Request Citizen Service"
            then: ["access to the Acute Prescription Request Citizen Service is enabled for the Proxy"]
          - id: AC2
            title: "disable Proxy access to the Acute Prescription Request Citizen Service"
            given: "the Health or Care Professional is permitted to configure access to Citizen Services"
            when: "they select to disable the Proxy access to the Acute Prescription Request Citizen Service"
            then: ["access to the Acute Prescription Request Citizen Service is disabled for the Proxy"]

  may:
    description: >
      Describes additional functionality associated with the Capability. Suppliers should
      consider all MAY Epics as part of their User Research. Suppliers can choose to map
      their Solutions to these Epics and they will be evaluated via Capability Assessment.
      Contracting Authorities or purchasing organisations may require these Epics as
      product qualification or requirements criteria.
    items:
      - id: E00186
        title: "search for Electronic Patient Records (EPRs)"
        user_story:
          role: "Health or Care Professional"
          want: "search for Electronic Patient Records (EPRs)"
          so_that: "I can find Electronic Patient Records for Patients"
        acceptance_criteria:
          - id: AC1
            title: "search for an Electronic Patient Record (EPR)"
            given: "the Health or Care Professional is permitted to view EPRs"
            when: "they search for an Electronic Patient Record (EPR)"
            then: ["the search results are displayed"]
        supporting_info: >
          Demographic Information to search with MAY include: Family name, Given name,
          Preferred name, Date of birth, NHS Number, Address, Postcode, Telephone number,
          Registration Type, Local Patient identifier.

      - id: E00187
        title: "search content of an Electronic Patient Record (EPR)"
        user_story:
          role: "Health or Care Professional"
          want: "be able to search the content of an Electronic Patient Record (EPR)"
          so_that: "I can view Patient information relevant to my search term"
        acceptance_criteria:
          - id: AC1
            title: "search the content of an Electronic Patient Record (EPR)"
            given: "the Health or Care Professional has permission to manage an EPR"
            when: "the Health or Care Professional enters a search term"
            then: ["content that matches the search term in the EPR is displayed"]
        implementation_details:
          - "Searches will include: all/any combination of coded or structured data; a specified text string across both structured data and free text fields; a document using classification and/or document properties"

      - id: E00188
        title: "search the contents of documents attached to an Electronic Patient Record (EPR)"
        user_story:
          role: "Health or Care Professional"
          want: "be able to search the contents of a document attached to an EPR"
          so_that: "I can view content within the document that is relevant to my search term"
        acceptance_criteria:
          - id: AC1
            title: "search the contents of a document"
            given: "there is a document attached to an EPR"
            when: "the Health or Care Professional selects to search the content of a document for a specific term"
            then: ["document contents that match the search term are displayed"]

      - id: E00189
        title: "print the Electronic Patient Record (EPR)"
        user_story:
          role: "Health or Care Professional"
          want: "be able to print the Electronic Patient Record (EPR)"
          so_that: "the EPR can be printed"
        acceptance_criteria:
          - id: AC1
            title: "print the Electronic Patient Record (EPR)"
            given: "the Health or Care Professional is permitted to manage an EPR"
            when: "the Health or Care Professional selects to print an EPR"
            then: ["the EPR is printed"]

      - id: E00190
        title: "export the Electronic Patient Record (EPR)"
        user_story:
          role: "Health or Care Professional"
          want: "be able to export the Electronic Patient Record (EPR)"
          so_that: "the EPR can be exported into an electronic file format"
        acceptance_criteria:
          - id: AC1
            title: "export the Electronic Patient Record (EPR)"
            given: "the Health or Care Professional is permitted to export an EPR"
            when: "the Health or Care Professional selects to export an EPR"
            then: ["the EPR is exported"]

      - id: E00191
        title: "manage a personalised display of Electronic Patient Records (EPRs)"
        user_story:
          role: "Health or Care Professional"
          want: "manage a personalised display for Electronic Patient Records (EPRs)"
          so_that: "I have a personalised display of EPRs that can be saved and applied to all EPRs"
        acceptance_criteria:
          - id: AC1
            title: "create a personalised display"
            given: "the Health or Care Professional is permitted to view EPRs"
            when: "they select to create a personalised display for EPRs"
            then: ["a personalised display is created"]
          - id: AC2
            title: "view EPRs using personalised display"
            given: "the Health or Care Professional has created a personalised display"
            when: "they select to view an EPR"
            then: ["the EPR is displayed with the personalised display applied"]
          - id: AC3
            title: "amend a personalised display"
            given: "the Health or Care Professional has created a personalised display"
            when: "they select to amend the personalised display"
            then: ["the personalised display is amended"]
          - id: AC4
            title: "delete a personalised display"
            given: "the Health or Care Professional has created a personalised display"
            when: "they select to delete the personalised display"
            then:
              - "the personalised display is deleted"
              - "the default display is applied to all Patient Records the Health or Care Professional views"

      - id: E00192
        title: "notifications for outstanding actions on an Electronic Patient Record (EPR)"
        user_story:
          role: "Health or Care Professional"
          want: "be notified when there are outstanding actions on an EPR"
          so_that: "I am notified of the outstanding actions"
        acceptance_criteria:
          - id: AC1
            title: "notification of outstanding actions"
            given: "the Health or Care Professional is accessing the EPR"
            when: "there are outstanding actions relating to the Patient"
            then: ["the Health or Care Professional is notified"]
        supporting_info: >
          Outstanding actions MAY include: incompleteness of a registration record,
          contact details requiring verification, outstanding tasks, outstanding Referrals,
          documents with outstanding filing status.

      - id: E00193
        title: "manage Patient Related Persons"
        user_story:
          role: "Health or Care Professional"
          want: "manage Patient Related Persons"
          so_that: "there is an up to date record of Patient Related Persons"
        acceptance_criteria:
          - id: AC1
            title: "create Patient Related Persons"
            given: "the Health or Care Professional is permitted to create a Patient Related Person"
            when: "they select to create a Patient Related Person"
            then: ["the Patient Related Person is created"]
          - id: AC2
            title: "amend Patient Related Persons"
            given: "the Health or Care Professional is permitted to amend a Patient Related Person"
            when: "they select to amend a Patient Related Person"
            then: ["the Patient Related Person is amended"]
          - id: AC3
            title: "view Patient Related Persons"
            given: "the Health or Care Professional is permitted to view a Patient Related Person"
            when: "they select to view a Patient Related Person"
            then: ["the Patient Related Person is displayed"]
          - id: AC4
            title: "delete Patient Related Persons"
            given: "the Health or Care Professional is permitted to delete a Patient Related Person"
            when: "they select to delete a Patient Related Person"
            then: ["the Patient Related Person is deleted"]
        supporting_info: >
          Types of Related Persons MAY include: Family member, Carer, Next of Kin,
          Cared for Individual, Psychiatric nurse, Patient's social worker.

      - id: E00194
        title: "manage Patient Problem lists"
        user_story:
          role: "Health or Care Professional"
          want: "a problem-orientated approach to recording and viewing Patient data"
          so_that: "information from the EPR relating to a single Problem can be viewed together"
        acceptance_criteria:
          - id: AC1
            title: "add a new Problem to the Patient's Problem list"
            given: "the Health or Care Professional is permitted to manage Patient Problem lists"
            when: "the Health or Care Professional selects to create a new Problem"
            then: ["the Problem is created on the Patient's Problem list"]
          - id: AC2
            title: "remove Problem from the Patient's Problem list"
            given: "the Health or Care Professional is permitted to manage Patient Problem lists"
            when: "the Health or Care Professional selects to remove a Problem"
            then: ["the Problem is removed from the Patient's Problem list"]

      - id: E00195
        title: "manage manual Patient Alerts for Electronic Patient Records (EPRs)"
        user_story:
          role: "Health or Care Professional"
          want: "manually manage Patient Alerts for EPRs"
          so_that: "key characteristics relating to the Patient are indicated to Health or Care Professionals"
        acceptance_criteria:
          - id: AC1
            title: "create a manual Patient Alert"
            given: "the Health or Care Professional is permitted to manage Patient Alerts"
            when: "the Health or Care Professional selects to create a Patient Alert"
            then: ["the Patient Alert is created"]
          - id: AC2
            title: "view manual Patient Alerts"
            given: "the Health or Care Professional is permitted to view EPRs and a manual Patient Alert is recorded"
            when: "the Health or Care Professional selects to view a Patient's EPR"
            then: ["the Patient Alert is displayed"]
          - id: AC3
            title: "remove a manual Patient Alert"
            given: "the Health or Care Professional is permitted to manage Patient Alerts"
            when: "the Health or Care Professional selects to remove a Patient Alert"
            then: ["the Patient Alert is removed"]

      - id: E00196
        title: "manage automatic Patient Alerts for Electronic Patient Records (EPRs)"
        user_story:
          role: "Health or Care Professional"
          want: "Patient Alerts to be automatically displayed for EPRs"
          so_that: "key characteristics relating to the Patient are indicated automatically"
        acceptance_criteria:
          - id: AC1
            title: "create automatic Patient Alerts"
            given: "the Health or Care Professional is permitted to manage automatic Patient Alerts"
            when: "the Health or Care Professional selects to create an automatic Patient Alert"
            then:
              - "they can specify the criteria for the Patient Alert to be displayed"
              - "the automatic Patient Alert is created"
          - id: AC2
            title: "view configuration for automatic Patient Alerts"
            given: "the Health or Care Professional is permitted to manage automatic Patient Alerts"
            when: "the Health or Care Professional selects to view the configuration of an automatic Patient Alert"
            then: ["the configuration for the automatic Patient Alert is displayed"]
          - id: AC3
            title: "amend automatic Patient Alerts"
            given: "the Health or Care Professional is permitted to manage automatic Patient Alerts"
            when: "the Health or Care Professional selects to amend an automatic Patient Alert"
            then: ["the automatic Patient Alert is amended"]
          - id: AC4
            title: "view automatic Patient Alerts for Patients"
            given: "there are automatic Patient Alerts created and the criteria for an automatic Patient Alert is met"
            when: "the Health or Care Professional selects to view a Patient's EPR"
            then: ["the Patient Alert is displayed for that Patient's EPR"]
          - id: AC5
            title: "delete automatic Patient Alerts"
            given: "the Health or Care Professional is permitted to manage automatic Patient Alerts"
            when: "the Health or Care Professional selects to delete an automatic Patient Alert"
            then:
              - "the automatic Patient Alert is deleted"
              - "it is no longer displayed for Patients"

      - id: E00197
        title: "support Registrations for Private Patients"
        user_story:
          role: "Health or Care Professional"
          want: "categorise Patients as being Private Registrations"
          so_that: "I can support Private Registrations"
        acceptance_criteria:
          - id: AC1
            title: "record Patient Registration Type as Private"
            given: "the Health or Care Professional is permitted to create Patient Registrations"
            when: "the Health or Care Professional selects to create a Patient Registration"
            then:
              - "the Registration Type can be recorded as Private"
              - "the Patient's individual GP can be recorded"
              - "the Patient Registration is created"

      - id: E00198
        title: "support Registrations for Other Services"
        user_story:
          role: "Health or Care Professional"
          want: "categorise Patients as Registered for Other Services"
          so_that: "I can support Registrations for Other Services"
        acceptance_criteria:
          - id: AC1
            title: "record Patient Registration Type as Other Services"
            given: "the Healthcare Organisation is permitted to create Patient Registrations"
            when: "the Health or Care Professional selects to create a Patient Registration"
            then:
              - "the Patient's Registration Type can be recorded as Other Services"
              - "the Patient's individual GP can be recorded"
              - "the Patient Registration is created"
        supporting_info: >
          Examples of Registrations for Other Services MAY include: Enhanced services,
          Locally commissioned services.

      - id: E00199
        title: "manage Subject Access Request (SAR) requests"
        user_story:
          role: "Health or Care Professional"
          want: "manage SAR requests"
          so_that: "I can manage SAR requests"
        acceptance_criteria:
          - id: AC1
            title: "create SAR requests"
            given: "the Health or Care Professional is permitted to create SAR requests"
            when: "they select to create a SAR request"
            then: ["the SAR request is created"]
          - id: AC2
            title: "amend SAR requests"
            given: "the Health or Care Professional is permitted to amend SAR requests"
            when: "they select to amend a SAR request"
            then: ["the SAR request is amended"]
          - id: AC3
            title: "view SAR requests"
            given: "the Health or Care Professional is permitted to view SAR requests"
            when: "they select to view a SAR request"
            then: ["the SAR request is displayed"]
          - id: AC4
            title: "delete SAR requests"
            given: "the Health or Care Professional is permitted to delete SAR requests"
            when: "they select to delete a SAR request"
            then: ["the SAR request is deleted"]
        implementation_details:
          - "Enable the Patient's EPR to be screened by Authorised Users for data that could be detrimental to the Patient if viewed and/or third party information before responding to a Subject Access Request"
          - "Adhere to the General Data Protection Regulation (GDPR)"

      - id: E00200
        title: "view Subject Access Request reports"
        user_story:
          role: "Health or Care Professional"
          want: "view Subject Access Request reports"
          so_that: "I can see Subject Access Request activity"
        acceptance_criteria:
          - id: AC1
            title: "view Subject Access Request reports"
            given: "the Health or Care Professional is permitted to view Subject Access Request reports"
            when: "the Health or Care Professional selects to view a Subject Access Request report"
            then: ["the Subject Access Request report is displayed"]

      - id: E00201
        title: "verify Patient Contact Details"
        user_story:
          role: "Health or Care Professional"
          want: "verify a Patient's Contact Details"
          so_that: "I have a record that the Patient's Contact Details have been verified"
        acceptance_criteria:
          - id: AC1
            title: "successful verification of a Patient's Contact Details"
            given: "the Health or Care Professional is permitted to verify a Patient's Contact Details"
            when: "they select to verify the Patient's Contact Details and verification is successful"
            then: ["the Contact Details status is updated to Verified"]
          - id: AC2
            title: "manual update to a Patient's Contact Details verification status"
            given: "the Health or Care Professional is permitted to amend the verification status of a Patient's Contact Details"
            when: "they select to amend the verification status"
            then: ["the verification status is amended"]
        implementation_details:
          - "Verify Patient Contact Details via a time-limited challenge-response mechanism, where the Solution will request confirmation details in the response"
        supporting_info: >
          Contact Details requiring verification MAY include: Email Address, Mobile Phone Number.
          Verification statuses MAY include: Verified, Unverified (default for new details),
          Requires Re-verification.

      - id: E00202
        title: "configure Welcome Message for Citizen Services"
        user_story:
          role: "Health or Care Professional"
          want: "configure a Welcome Message for Citizen Services"
          so_that: "a Welcome Message for Citizen Services is displayed for Citizens when accessing Citizen Services"
        acceptance_criteria:
          - id: AC1
            title: "configure a Welcome Message for Citizen Services"
            given: "the Health or Care Professional is permitted to configure a Welcome Message for Citizen Services"
            when: "they select to configure a Welcome Message"
            then: ["the Welcome Message is configured"]

      - id: E00205
        title: "manage Acute Prescription Request Citizen Service for a Patient and the Practice"
        user_story:
          role: "Health or Care Professional"
          want: "manage Patient access to the Acute Prescription Request Citizen Service"
          so_that: "I can manage Patient access to the Acute Prescription Request Citizen Service"
        acceptance_criteria:
          - id: AC1
            title: "enable Patient access to the Acute Prescription Request Citizen Service"
            given: "the Health or Care Professional is permitted to configure access to Citizen Services"
            when: "they select to enable a Patient's access to the Acute Prescription Request Citizen Service"
            then: ["access to the Acute Prescription Request Citizen Service is enabled for the Patient"]
          - id: AC2
            title: "disable Patient access to the Acute Prescription Request Citizen Service"
            given: "the Health or Care Professional is permitted to configure access to Citizen Services"
            when: "they select to disable the Patient's access to the Acute Prescription Request Citizen Service"
            then: ["access to the Acute Prescription Request Citizen Service is disabled for the Patient"]
          - id: AC3
            title: "enable Acute Prescription Request Citizen Service for the Practice"
            given: "the Health or Care Professional is permitted to enable a Citizen Service for the Practice"
            when: "they select to enable the Acute Prescription Request Citizen Service for the Practice"
            then: ["the Acute Prescription Request Citizen Service is enabled for the Practice"]
          - id: AC4
            title: "disable Acute Prescription Request Citizen Service for the Practice"
            given: "the Health or Care Professional is permitted to disable a Citizen Service for the Practice"
            when: "they select to disable the Acute Prescription Request for the Practice"
            then: ["the Acute Prescription Request Citizen Service is disabled for the Practice"]

      - id: E00213
        title: "identify Patients outside of Catchment Area"
        user_story:
          role: "Health or Care Professional"
          want: "Patients that reside outside the Catchment Area to be identified"
          so_that: "Patients that reside outside the Catchment Area are identified"
        acceptance_criteria:
          - id: AC1
            title: "identify Patients outside of catchment area"
            given: "the Health or Care Professional is permitted to view EPRs"
            when: "the Health or Care Professional selects to view an EPR and the Patient resides outside the Catchment area"
            then: ["the Patient is identified as residing outside the Catchment Area"]

      - id: E00214
        title: "view Patient reports"
        user_story:
          role: "Health or Care Professional"
          want: "view Patient reports"
          so_that: "I can see Patient activity"
        acceptance_criteria:
          - id: AC1
            title: "view Patient reports"
            given: "the Health or Care Professional is permitted to view Patient reports"
            when: "the Health or Care Professional selects to view a Patient report"
            then: ["the report is displayed"]

      - id: E00215
        title: "manage Patient Cohorts from Search Results"
        user_story:
          role: "Health or Care Professional"
          want: "manage Patient Cohorts from Search Results"
          so_that: "Patient Cohorts can be managed"
        acceptance_criteria:
          - id: AC1
            title: "create Patient Cohorts from Search Results"
            given: "the Health or Care Professional is permitted to manage Patient Cohorts and there are Search Results available"
            when: "the Health or Care Professional selects to create a Patient Cohort from Search Results"
            then: ["the Patient Cohort is created"]
          - id: AC2
            title: "update Patient Cohorts"
            given: "the Health or Care Professional is permitted to manage Patient Cohorts"
            when: "the Health or Care Professional selects to update a Patient Cohort"
            then: ["the Patient Cohort is updated"]
          - id: AC3
            title: "delete Patient Cohorts"
            given: "the Health or Care Professional is permitted to manage Patient Cohorts"
            when: "the Health or Care Professional selects to delete a Patient Cohort"
            then: ["the Patient Cohort is deleted"]

      - id: E00216
        title: "Patient-based report on Capitation"
        user_story:
          role: "Health or Care Professional"
          want: "generate a report on current registered Patients"
          so_that: "I have a Patient-based report on Capitation"
        acceptance_criteria:
          - id: AC1
            title: "generate a Patient-based report on Capitation"
            given: "the Health or Care Professional is permitted to generate a report"
            when: "they select to generate a report on current registered Patients listed by their GP"
            then: ["the report results are displayed"]

      - id: E00217
        title: "Patient-based report on childhood vaccinations and immunisations"
        user_story:
          role: "Health or Care Professional"
          want: "generate a Patient-based report on childhood vaccinations and immunisations"
          so_that: "I can understand vaccination and immunisation coverage for my Patients"
        acceptance_criteria:
          - id: AC1
            title: "generate a Patient-based report on childhood vaccinations and immunisations"
            given: "the Health or Care Professional is permitted to generate a report"
            when: "they select to generate a Patient-based report on childhood vaccinations and immunisations"
            then: ["the report results are displayed"]
        implementation_details:
          - "Support existing Childhood Immunisation Schemes as per the General Medical Services Statement of Financial Entitlements Directions"

      - id: E00218
        title: "Patient-based report on Carers"
        user_story:
          role: "Health or Care Professional"
          want: "generate a Patient-based report on Carers"
          so_that: "I can understand which of my Patients have Carers"
        acceptance_criteria:
          - id: AC1
            title: "generate a Patient-based report on Carers"
            given: "the Health or Care Professional is permitted to generate a report"
            when: "they select to generate a Patient-based report on Carers"
            then: ["the report results are displayed"]
        supporting_info: >
          Examples of reports on Carers MAY include: a list of Carers linked to Patients;
          Carers links to specified Patient Characteristics.

roadmap:
  items:
    - title: "Automated Patient Registration - uplift to include all encounter types"
      capabilities:
        - "Patient Information Maintenance - GP"
        - "Register with a GP Surgery Service"
      status: Published
      effective_date: "2026-11-16"
      description: >
        Update to automated Patient Registration - Register with a GP Surgery Service
        requirements to automatically process GP Registrations for encounter types 1, 2, 4
        and 5 in addition to encounter type 3, that is already being processed.
      change_type: Uplift
      change_route: "Managed Capacity - Other"

    - title: "Ingestion of Pharmacy First Urgent Medicine Supply information from Community Pharmacies into GP Solutions"
      capabilities:
        - "Patient Information Maintenance - GP"
        - "Digital Medicines and Pharmacy FHIR Payload"
        - "Consultation Management - Community Pharmacy"
      status: Published
      effective_date: "2026-12-09"
      description: >
        Render HTML and ingest structured Pharmacy First Urgent Medicine Supply information
        from Community Pharmacies into Patient Electronic Patient Records (EPRs) in GP Solutions.
      change_type: Uplift
      change_route: "Managed Capacity - Minor/Patch uplifts"

    - title: "Patient Flags Service - Reasonable Adjustments (RA) Flag"
      capabilities:
        - "Patient Information Maintenance - GP"
        - "Multicast Notification Service (MNS)"
      status: Published
      effective_date: "2027-01-08"
      description: >
        Enable national sharing and management of Patients Reasonable Adjustments Flag
        via the Patient Flags Service - FHIR API.
      change_type: New
      change_route: "Managed Capacity - Other"

    - title: "Patient Flags Service - Child Protection - Information Sharing (CP-IS) Flag"
      capabilities:
        - "Patient Information Maintenance - GP"
        - "Patient Flags Service"
      status: Published
      effective_date: "2027-02-08"
      description: >
        Enable national sharing and management of Patients Child Protection - Information
        Sharing Flags via the Patient Flags Service - FHIR API.
      change_type: Uplift
      change_route: "Managed Capacity - Other"

    - title: "Patient Flags Service - Female Genital Mutilation (FGM) Flag"
      capabilities:
        - "Patient Information Maintenance - GP"
        - "Patient Flags Service"
      status: Published
      effective_date: "2027-03-08"
      description: >
        Enable national sharing and management of Female Genital Mutilation Flag data
        via the Patient Flags Service - FHIR API.
      change_type: Uplift
      change_route: "Managed Capacity - Other"

    - title: "National Proxy Service"
      capabilities:
        - "Patient Information Maintenance - GP"
        - "Validated Relationship Service (VRS)"
        - "GP Connect (Patient Facing) User Permissions"
        - "GP Connect (Patient Facing) Access Record"
        - "GP Connect (Patient Facing) Prescriptions"
        - "Multicast Notification Service (MNS)"
      status: Published
      effective_date: "2027-04-20"
      description: >
        Integrate with the National Proxy Service.
      change_type: New
      change_route: "Managed Capacity - Other"

    - title: "Recording and displaying Unknown Clinical Trial Medication"
      capabilities:
        - "Prescribing - GP"
        - "Patient Information Maintenance - GP"
      status: Draft
      effective_date: null
      description: >
        Record and display Unknown Clinical Trial Medication to improve visibility and
        support safer prescribing.
      change_type: Uplift
      change_route: "Managed Capacity - Other"

    - title: "Calculate QRISK3 Scores"
      capabilities:
        - "Patient Information Maintenance - GP"
      status: Draft
      effective_date: null
      description: >
        Uplift to the Patient Information Maintenance - GP Capability to include a new
        MUST Epic for calculating QRISK3 scores.
      change_type: Uplift
      change_route: "Managed Capacity - Minor/Patch uplifts"

    - title: "NHS Health Check online"
      capabilities:
        - "Patient Information Maintenance - GP"
        - "Multicast Notification Service (MNS)"
      status: Draft
      effective_date: null
      description: >
        Ingestion of NHS Health Check online data into Patients' Electronic Patient Records (EPRs).
      change_type: New
      change_route: "Managed Capacity - Other"

    - title: "Access documents in the National Document Repository (NDR) via the National Record Locator Service (NRLS)"
      capabilities:
        - "Patient Information Maintenance - GP"
      status: Draft
