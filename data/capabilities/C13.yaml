            then:
              - "the Citizen Service Access is enabled for that Proxy"
              - "the Health or Care Professional can specify an end date for the Citizen Service Access for that Proxy"
              - "the Proxy is notified that the Citizen Service Access is enabled on behalf of the Patient"
          - id: AC2
            title: "disable Proxy Citizen Service Access"
            given: "the Health or Care Professional is permitted to disable Citizen Service Access"
            when: "the Health or Care Professional selects to disable Citizen Service Access for a Proxy"
            then: ["the Citizen Service Access is disabled for that Proxy"]
