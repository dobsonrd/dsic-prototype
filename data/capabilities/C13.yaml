metadata:
  id: C13
  name: "Patient Information Maintenance - GP"
  version: "10.0.2"
  type: Capability
  category: "Patient care management"
  status: Effective
  effective_date: "2026-09-23"
  contracting_vehicles:
    - "Digital Primary Care"
    - "GP IT Futures"
    - "Tech Innovation"

description: >
  Supports the registration of Patients and the maintenance of all Patient personal
  information including demographics. Supports the organisation and presentation of a
  comprehensive Electronic Patient Record (EPR) and enables other organisations to access
  this information. Also supports configuring access to Citizen Services and the submission
  of data to the Authority for monitoring, research and payment purposes.

outcomes:
  - audience: "For a Patient"
    text: >
      The accurate recording of a Patient's personal information which contributes to the
      identification of the Patient and sharing of correct data across health and care.
      Increased involvement in their own care through enablement of Citizen Services.
      Patient safety is increased and facilitates finding Patients at risk.

  - audience: "For General Practice"
    text: >
      The organisation and presentation of a comprehensive Electronic Patient Record (EPR)
      ensures up to date and relevant information is available to appropriate staff to
      support timely Patient care. It supports effective communication with Patients and
      other organisations as well as forming the basis for enabling access to Citizen services.

  - audience: "For the wider NHS and social care system"
    text: >
      The accurate recording of a Patient's personal information, the organisation and
      presentation of a comprehensive Electronic Patient Record (EPR) and making it
      available across care settings improves efficiency, promotes collaboration and
      encourages the use of a lifelong integrated care record.

epics:
  must:
    description: >
      Describes the minimum functionality required to deliver a Capability. Solutions MUST
      be successfully evaluated against each Epic and Acceptance Criteria via Capability
      Assessment in order to be associated with this Capability.
    items:

      - id: E00163
        title: "manage Patient Registrations"
        user_story:
          role: "Health or Care Professional"
          want: "manage Patients Registrations"
          so_that: "I can manage which Patients are currently registered with my Healthcare Organisation"
        acceptance_criteria:
          - id: AC1
            title: "create a Patient Registration"
            given: "the Health or Care Professional is permitted to create Patient Registrations"
            when: "the Health or Care Professional selects to create a Patient Registration"
            then:
              - "the Registration Type is recorded"
              - "the date the Patient Registration started is recorded"
              - "the Named Accountable GP for the Patient is recorded"
              - "the Patient Registration is created"
          - id: AC2
            title: "amend a Patient Registration"
            given: "the Health or Care Professional is permitted to amend Patient Registrations"
            when: "the Health or Care Professional selects to amend a Patient Registration"
            then:
              - "the Patient Registration is amended"
          - id: AC3
            title: "end a Patient Registration"
            given: "the Health or Care Professional is permitted to end Patient Registrations"
            when: "the Health or Care Professional selects to end a Patient Registration"
            then:
              - "the date the Patient Registration ended is recorded"
              - "the Patient Registration is ended"
          - id: AC4
            title: "view Patient Registration information"
            given: "the Health or Care Professional is permitted to view Patient Registration information"
            when: "the Health or Care Professional selects to view a Patient's Registration information"
            then:
              - "the Patient's Registration information is displayed"
        implementation_details:
          - "Patient Registration Types will be in line with legislative registration statuses as defined in the GP Contract"
        supporting_info: >
          Registration Types MAY include, but are not limited to: Fully Registered,
          Temporary Resident, Immediately necessary treatment.

      - id: E00164
        title: "manage Patient Demographic Information"
        user_story:
          role: "Health or Care Professional"
          want: "manage Patient Demographic Information"
          so_that: "Patient Demographic Information is managed"
        acceptance_criteria:
          - id: AC1
            title: "create Patient Demographic Information"
            given: "the Health or Care Professional is permitted to create Patient Demographic Information"
            when: "the Health or Care Professional selects to create Demographic Information for a Patient"
            then:
              - "the Patient's NHS Number is recorded"
              - "the Patient's name is recorded"
              - "the Patient's date of birth is recorded"
              - "the Patient's address is recorded"
              - "the Patient's telephone number can be recorded"
              - "other contact details for the Patient can be recorded"
              - "the Patient's ethnicity can be recorded"
              - "the Patient Demographic Information is created"
          - id: AC2
            title: "amend Patient Demographic Information"
            given: "the Health or Care Professional is permitted to amend Patient Demographic Information"
            when: "the Health or Care Professional selects to amend Patient Demographic Information"
            then:
              - "the Patient Demographic Information is amended"
          - id: AC3
            title: "view Patient Demographic Information"
            given: "the Health or Care Professional is permitted to view Patient Demographic Information"
            when: "the Health or Care Professional selects to view a Patient's Demographic Information"
            then:
              - "the Patient's Demographic Information is displayed"
        supporting_info: >
          Examples of other contact details MAY include, but are not limited to: Email address,
          Alternative telephone numbers (e.g. work). Other examples of Demographic Information
          MAY include, but are not limited to: Preferred Name, Former Family Name, Preferred
          written language, Preferred spoken language, Gender identity, Sex.

