            when: "the Health or Care Professional selects to enable the default for Prescription Ordering Citizen Service for Patients"
            then: ["the Prescription Ordering Citizen Service is enabled by default when a new Patient is enabled for access to Citizen Services"]
          - id: AC7
            title: "disable the default for Prescription Ordering Citizen Service for Patients"
            given: "the Health or Care Professional is permitted to configure the default access to Citizen Services for Patients"
            when: "the Health or Care Professional selects to disable the default for the Prescription Ordering Citizen Service for Patients"
            then: ["the default is disabled"]
        implementation_details:
          - "When Prospective Access to Full Record Access Level is enabled as the default, Patients excluded for Prospective Access default to Summary Information Record Access Level. Exclusion criteria: specific SNOMED CT codes recorded (1364731000000104, 1290301000000109, 1290331000000103) without a later override code; or Patient is under 16 years old."
          - "On the Patient's 16th Birthday, Access Level automatically updates to Summary Information Record Access Level for Patients with no previous access; remains the same for Patients with existing access."
          - "If the start date is before the date the Patient Registration started, the start date is set to the same as the Patient Registration started date."

