              - "the Identity Evidence type is displayed"
              - "who carried out the identity verification process is displayed"
        supporting_info: >
          For further information on Identity Verification please see DAPB3051 (previously
          DCB3051): Identity Verification and Authentication Standard for Digital Health and
          Care Services. Further information on Citizen Services can be found in the Citizen
