        implementation_details:
          - "Suppliers of new Solutions: GP Connect (Patient Facing) User Permissions Standard (Provider requirements); NHS login Provisioning Standard"
          - "Suppliers of Solutions which ARE currently deployed: IM1 - Interface Mechanism Standard (Patient interface Provider requirements) or GP Connect (Patient Facing) User Permissions Standard"
          - "Ability to create, view and amend Verified User Accounts"
          - "Ability to generate Verified User Accounts credentials information (ODS Code, Verified User Accounts ID, Verified User Accounts Linkage Key, List of available Citizen Services)"
          - "Support linking of Online Service Account and Verified User Account"
          - "The Solution supports resetting of the VUA Linkage Key; upon reset, VUA reverts to Inactive and all Citizen Services access is terminated"
