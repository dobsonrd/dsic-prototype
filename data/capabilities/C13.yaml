          - "Suppliers of new Solutions: GP Connect (Patient Facing) Access Record Standard (Provider requirements)"
          - "Suppliers of Solutions which ARE currently deployed: IM1 - Interface Mechanism Standard (Patient interface Provider requirements) or GP Connect (Patient Facing) Access Record Standard (Provider requirements)"

      - id: E00174
        title: "configure access to elements of the Electronic Patient Record (EPR) in the View Record Citizen Service"
        user_story:
          role: "Health or Care Professional"
          want: "record that elements of the Electronic Patient Record (EPR) are Restricted from View Record"
          so_that: "elements recorded as Restricted from View Record are not displayed to Citizens via the View Record Citizen Service"
        acceptance_criteria:
          - id: AC1
            title: "record existing elements of the EPR as Restricted from View Record upon review"
            given: "the Health or Care Professional is permitted to review the Electronic Patient Record (EPR)"
            when: "the Health or Care Professional selects to record an existing element of the EPR as Restricted from View Record"
            then:
              - "this element is recorded as Restricted from View Record"
              - "it is not displayed in Citizen Services"
          - id: AC2
            title: "record elements of the EPR as Restricted from View Record whilst entering information"
            given: "the Health or Care Professional is permitted to enter information into the EPR"
            when: "the Health or Care Professional enters information into the EPR and selects to record an element as Restricted from View Record"
            then:
              - "this element is recorded as Restricted from View Record"
              - "it is not displayed via the View Record Citizen Service"
          - id: AC3
            title: "indicate Restricted from View Record elements to Health or Care Professionals"
            given: "the Health or Care Professional is permitted to view the EPR and there are elements recorded as Restricted from View Record"
            when: "the Health or Care Professional selects to view the EPR"
            then: ["the Health or Care Professional can view that these elements are Restricted from View Record"]
          - id: AC4
            title: "update elements recorded as Restricted from View Record as available for View Record"
            given: "the Health or Care Professional is permitted to view the EPR and there are elements recorded as Restricted from View Record"
            when: "the Health or Care Professional selects to record an element as available for View Record"
            then:
              - "this element is recorded as available for the View Record Citizen Service"
              - "it is displayed via the View Record Citizen Service"
        implementation_details:
          - "Ability for Health or Care Professionals to record any type of element recorded in the EPR as Restricted from View Record Citizen Service"
        supporting_info: >
          Elements of the EPR MAY include, but are not limited to: an EPR as a whole,
          groups of elements (e.g. an entire consultation), or individual elements
          (e.g. a code, a medication). Examples of when restriction may be needed include
          reviewing Pathology results, Radiology results, or external documents.

      - id: E00255
