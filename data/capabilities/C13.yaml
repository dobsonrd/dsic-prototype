      - id: E00755
        title: "configure defaults for Citizen Service access for Patients"
        user_story:
          role: "Health or Care Professional"
          want: "configure default access to Citizen Services for Patients"
          so_that: "configuring access to Citizen Services for Patients is more efficient and inline with current policy"
        acceptance_criteria:
          - id: AC1
            title: "enable the default as Prospective Access to Full Record Access Level for View Record Citizen Service"
            given: "the Health or Care Professional is permitted to configure the default access to Citizen Services for Patients"
            when: "the Health or Care Professional selects to enable the default as Prospective Access to Full Record Access Level for Patients"
            then:
              - "the Health or Care Professional records a start date for data to be available from"
              - "Prospective Access to Full Record Access Level is enabled by default when a new Patient is enabled for access to Citizen Services"
              - "Prospective Access to Full Record Access Level is automatically enabled when a Patient who is already enabled for access to Citizen Services reaches their 16th birthday"
          - id: AC2
            title: "enable the default as Full Record Access Level for View Record Citizen Service"
            given: "the Health or Care Professional is permitted to configure the default access to Citizen Services for Patients"
            when: "the Health or Care Professional selects to enable the default as Full Record Access Level for Patients"
            then: ["the Full Record Access Level is enabled by default when a new Patient is enabled for access to Citizen Services"]
          - id: AC3
            title: "disable the default for View Record Citizen Service for Patients"
            given: "the Health or Care Professional is permitted to configure the default access to Citizen Services for Patients"
            when: "the Health or Care Professional selects to disable the default for the View Record Citizen Service for Patients"
            then: ["the default is disabled"]
          - id: AC4
            title: "enable the default for Appointments Management Citizen Service for Patients"
            given: "the Health or Care Professional is permitted to configure the default access to Citizen Services for Patients"
            when: "the Health or Care Professional selects to enable the default for Appointments Management Citizen Service for Patients"
            then: ["the Appointments Management Citizen Service is enabled by default when a new Patient is enabled for access to Citizen Services"]
          - id: AC5
            title: "disable the default for Appointments Management Citizen Service for Patients"
            given: "the Health or Care Professional is permitted to configure the default access to Citizen Services for Patients"
            when: "the Health or Care Professional selects to disable the default for the Appointments Management Citizen Service for Patients"
            then: ["the default is disabled"]
          - id: AC6
