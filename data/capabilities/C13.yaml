            title: "enable Prospective Access to the Full Record Access Level for a Patient"
            given: "the Health or Care Professional is permitted to configure access to Citizen Services"
            when: "the Health or Care Professional selects to enable Prospective Access to the Full Record Access Level for a Patient"
            then:
              - "the Health or Care Professional records a start date for data to be available from"
              - "the Prospective Access to the Full Record Access Level is enabled for the Patient"
