          so_that: "I can efficiently restore Proxy Citizen Services Access on behalf of Patients"
        acceptance_criteria:
          - id: AC1
            title: "re-enable Citizen Service Access for a Proxy"
            given: "the Health or Care Professional is permitted to enable Citizen Service Access"
            when: "the Health or Care Professional selects to re-enable Citizen Service Access for a Proxy"
            then:
              - "the Citizen Service Access is re-enabled for that Proxy without requiring the re-entry of the Proxy's information"
              - "the Health or Care Professional can specify an end date for the Citizen Service Access for the Proxy"
              - "the Proxy is notified the Citizen Service Access is enabled on behalf of the Patient"

