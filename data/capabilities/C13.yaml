            title: "display Patient Alert in Electronic Patient Records (EPRs)"
            given: "the Health or Care Professional is permitted to view EPRs and a Patient Alert is recorded for that Patient's EPR"
            when: "the Health or Care Professional selects to view a Patient's EPR"
            then: ["the Patient Alert is displayed"]
        supporting_info: >
          Examples of Patient Alerts MAY include, but are not limited to: indicating the
          Patient is violent; indicating the Patient is on a certain chronic disease register.

