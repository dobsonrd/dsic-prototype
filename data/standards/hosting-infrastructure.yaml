# Hosting and Infrastructure Standard — Retained Requirements
# DSIC Capability Catalogue — NHS England Digital Services for Integrated Care
#
# Source: Hosting & Infrastructure Standard S29 v2.0.9
# This file contains the 11 retained/new requirements.
# Wording is unchanged from the source document, including original typos (noted inline).
#
# Section order: Minimum Hosting Standard (new) · Baseline Assurance · Network · Device Management
#
# Schema: /schema/standard.schema.yaml
# Last updated: 2026-10-09

metadata:
  id: "hosting-infrastructure"
  name: "Hosting and Infrastructure"
  standard_id: S29
  version: "2.0.9"
  type: Standard
  status: Effective
  effective_date: "2026-08-14"

sections:

  - id: hosting-quality
    name: "Minimum Hosting Standard"
    requirements:

      - id: CH5.0
        title: "Cloud Hosting Quality"
        section: "Cloud Hosting"
        level: MUST
        contracting_vehicles:
          - GP IT Futures
          - Tech Innovation
          - DFOCVC
          - Community Pharmacy Clinical Services
          - Digital Pathways
          - Solution Registry
          - Digital Primary Care
        text: >
          The Supplier will ensure that the cloud provider used to host the Solution, and
          the Supplier's configuration of that provider's services, meet the quality level
          set out for the Solution's Category. This applies to every cloud service and
          region the Solution uses. Provider certification is in addition to the Supplier's
          own certification under the Information Governance Standard. Hosting topology is
          to be shown in the documentation provided under HD1.0. Recovery objectives,
          backup and failover testing are set by the Business Continuity and Disaster
          Recovery Standard. Equivalent standards will be accepted where the Supplier
          demonstrates equivalence.
        criteria_table:
          - criterion: "Provider certification (covering every service and region used)"
            a: >
              ISO/IEC 27001 from a UKAS or IAF-accredited body, with ISO/IEC 27017 and
              27018, plus a SOC 2 Type II report or CSA STAR Level 2
            b: >
              ISO/IEC 27001 from a UKAS or IAF-accredited body, plus one of ISO/IEC 27017,
              SOC 2 Type II or CSA STAR Level 2
            c: "ISO/IEC 27001 from a UKAS or IAF-accredited body"
          - criterion: "NCSC Cloud Security Principles"
            a: >
              Provider publishes its response to all 14 principles; Supplier documents which
              responsibilities sit with the provider and which with the Supplier
            b: "Provider publishes its response to all 14 principles"
            c: "Provider publishes its response to all 14 principles"
          - criterion: "Hosting topology"
            a: >
              Hosted in a region with at least three availability zones, with production
              spread across them; also uses a second UK region where the provider has one
            b: "Production spread across at least two availability zones"
            c: "Single availability zone acceptable"
          - criterion: "Secure configuration"
            a: >
              Cloud tenancy configured against a recognised hardening baseline (e.g. CIS
              Benchmarks or the provider's security baseline), with continuous compliance
              monitoring and deviations documented
            b: "Configured against a recognised hardening baseline, reviewed at least annually"
            c: "Provider's default security baseline enabled, with exceptions documented"
          - criterion: "Assurance approach"
            a: "Full Assessment"
            b: "Self-certification with Supporting Evidence"
            c: "Self-certification"
          - criterion: "Evidence"
            a: >
              Certificates and reports with scope, list of services and regions used,
              responsibility matrix, latest configuration compliance report
            b: "Certificates with scope, list of services and regions used, latest baseline review"
            c: "Statement naming the provider, services and regions, with certificate reference"

      - id: DC1.0
        title: "Data Centre Hosting Quality"
        section: "Data Centre Hosting"
        level: MUST
        contracting_vehicles:
          - "All Contracting Vehicles under which co-location or Supplier-owned facilities are permitted"
        text: >
          The Supplier will ensure that every data centre used to host the Solution,
          including secondary sites, meets the quality level set out for the Solution's
          Category. This applies to co-location facilities and to facilities owned by the
          Supplier. Where a facility is operated by a third party, evidence is to relate to
          the data centre operator, and operator certification is in addition to the
          Supplier's own certification under the Information Governance Standard. Security
          of the facility is set by SEC1.0. Site and resilience design is to be shown in
          the documentation provided under HD1.0. Recovery objectives, backup and failover
          testing are set by the Business Continuity and Disaster Recovery Standard.
          Equivalent standards will be accepted where the Supplier demonstrates equivalence.
        criteria_table:
          - criterion: "Facility availability"
            a: >
              BS EN 50600 Availability Class 3 or above, independently certified or audited
              (Uptime Institute Tier III or TIA-942 Rated 3 accepted)
            b: "BS EN 50600 Availability Class 3 design alignment, evidenced by operator documentation"
            c: "BS EN 50600 Availability Class 2 or above"
          - criterion: "Sites"
            a: >
              Two geographically separate sites, both meeting this column; separation
              justified by a location risk assessment
            b: >
              Two geographically separate sites; the primary meets this column and the
              secondary meets Category C
            c: "One site meeting this column, plus a geographically separate location for backup data"
          - criterion: "Operator management systems"
            a: >
              ISO/IEC 27001 (UKAS or IAF-accredited) and ISO 9001, with Statement of
              Applicability and scope covering the facilities used
            b: "ISO/IEC 27001 (UKAS or IAF-accredited) covering the facilities used"
            c: "ISO/IEC 27001 (UKAS or IAF-accredited) covering the facilities used"
          - criterion: "Power and network"
            a: >
              Concurrently maintainable power and cooling; dual Internet (and NHS Network
              where used) connections via diverse carriers and entry points
            b: "Standby generation that can be refuelled in use; dual connections via diverse routes where available"
            c: "Standby power sufficient for controlled shutdown; carrier details documented"
          - criterion: "Platform hardening"
            a: >
              Operating systems, hypervisors and network devices hardened against a
              recognised baseline, with compliance checked at least quarterly and deviations
              documented
            b: "Hardened against a recognised baseline, reviewed at least annually"
            c: "Non-essential services and protocols disabled, with the approach documented"
          - criterion: "Facility audit"
            a: "Annual independent audit; results and work-off plans available to the Authority"
            b: "Annual audit; results available on request"
            c: "Operator audit statement"
          - criterion: "Assurance approach"
            a: "Full Assessment"
            b: "Self-certification with Supporting Evidence"
            c: "Self-certification"
          - criterion: "Evidence"
            a: >
              Certificates with scope, availability class certification or audit report,
              location risk assessment, latest hardening compliance report, latest audit
            b: "Certificates with scope, operator design documentation, latest baseline review"
            c: "Statement naming the facilities and operator, with certificate reference"

  - id: baseline-assurance
    name: "Baseline Assurance Standard Requirements"
    requirements:

      - id: HD1.0
        title: "Documentation"
        section: "Reporting & Documentation"
        level: MUST
        contracting_vehicles:
          - GP IT Futures
          - Tech Innovation
          - DFOCVC
          - Community Pharmacy Clinical Services
          - Digital Pathways
          - Solution Registry
          - Digital Primary Care
        text: >
          The Supplier will provide documentation which represents the non-functional
          technical architecture of the Solution, including but not limited to: data
          centre design, local and wide network architecture, and physical technology
          models. Documentation should include diagrams, and associated textual
          descriptions, as necessary to enable effective assurance of key Solution aspects.
        sub_requirements:
          - title: "Non-Functional Specification"
            description: "Defines the non-functional aspects of the system including but not limited to:"
            items:
              - "Details of any relevant contract service schedule(s)"
              - "Business continuity and disaster recovery design"
              - "Data Centre resilience design"
              - "Backup and Recovery Processes"
              - "Configuration Management including identification, control and verification"
              - "Performance monitoring design including categorisation of transactions and design of monitoring software including links into the Authority Solutions where relevant e.g. National Monitoring System (NMS)"
              - "Overall systems security design"
              - "Migration design showing design for process and data, details of any tools developed to support migration, details of duration and outages required to perform migration and data cleansing strategy"
              - "Capacity management design incorporating an indicative sizing model, a business transaction data forecast, an impact assessment on existing infrastructure and a baseline capacity plan"
              - "Availability Management design, including Component Failure Impact Assessment and monitoring"
              - "Services impact assessment including expected service management processes, helpdesk, maintenance, performance management and reporting changes"
              - "Support Model design, including dependencies on third parties (including NHS National Service Desk), support hours, escalation model and incident severity guidelines"
        notes:
          - "Document artefacts to be concise with a preference for diagrammatical form where the Supplier utilises as much of their own internal documentation as possible to reduce extra document production."
        categories:
          a: "Self-certification with Supporting Evidence — Supporting evidence to include: Documentation that covers all aspects listed within the Requirement."
          b: "Self-certification with Supporting Evidence — Supporting evidence to include: Documentation that covers all aspects listed within the Requirement."
          c: "Self-certification with Supporting Evidence — Supporting evidence to include: Documentation that covers all aspects listed within the Requirement."

      - id: SEC1.0
        title: "Security"
        section: "Security"
        level: MUST
        contracting_vehicles:
          - GP IT Futures
          - Tech Innovation
          - DFOCVC
          - Community Pharmacy Clinical Services
          - Digital Pathways
          - Solution Registry
          - Digital Primary Care
        text: >
          Due to the sensitive nature of the information in this section, the details are
          held in the file "Co-location and Provider Data Centre Hosting & Infrastructure
          Requirements - Security" and can be requested by emailing
          england.buying.catalogue@nhs.net. The Supplier will comply with all requirements
          in the "Co-location and Provider Data Centre Hosting & Infrastructure Requirements
          - Security" file.
        categories:
          a: "Refer to 'Co-location and Provider Data Centre Hosting & Infrastructure Requirements - Security' file for details."
          b: "Refer to 'Co-location and Provider Data Centre Hosting & Infrastructure Requirements - Security' file for details."
          c: "Refer to 'Co-location and Provider Data Centre Hosting & Infrastructure Requirements - Security' file for details."

  - id: network
    name: "Network"
    requirements:

      - id: HNT2.0
        title: "Network - QoS"
        section: "Network"
        level: MUST
        contracting_vehicles:
          - GP IT Futures
          - Tech Innovation
          - DFOCVC
          - Digital Primary Care
        text: >
          Communications in and out of the data centre will adhere to the HSCN connection
          Agreement and NHS Network QoS policy for the classification of data across the
          network, to enable network traffic prioritisation and 'class of service' to reduce
          network latency. The Supplier will evidence their adherence to the QoS policy, to
          the Authority, for changes to the system in how it communicates across the NHS
          Network, prior to release.
        references:
          - "HSCN Quality of Service overview"
          - "HSCN Technical Guidance"
        notes:
          - "\"HCSN Technical Guidance\" is the original wording in v2.0.9 (typo for HSCN)."
        categories:
          a: "Self-certification"
          b: "Self-certification"
          c: "Self-certification"

      - id: HNT2.1
        title: "NHS Network Connectivity"
        section: "Network"
        level: MUST
        contracting_vehicles:
          - GP IT Futures
          - Tech Innovation
          - DFOCVC
          - Digital Primary Care
        text: >
          The Supplier's NHS Network connections to be compliant with the HSCN Connection
          Agreement and compliant with the DNS and IP addressing policies for the network,
          where HSCN is used.
        categories:
          a: "Self-certification"
          b: "Self-certification"
          c: "Self-certification"

      - id: HNT3.1
        title: "NHS Networking Compliance"
        section: "Network"
        level: MUST
        contracting_vehicles:
          - GP IT Futures
          - Tech Innovation
          - DFOCVC
          - Digital Primary Care
        text: >
          The Supplier to provide evidence that the system complies with the requirements
          and best practice operating principals and guidance when operating over the NHS
          Network. Specifically the system to:
        items:
          - "Comply with the NHS Network QoS (Quality of Service) Policy"
          - "Performs adequately within the network latency constraints"
          - "Performs adequately within the typical bandwidth (downstream and upstream) provided to consumers"
          - "Collaborate with the Authority and relevant network providers to resolve escalated performance issues which could include installing diagnostic probes into the DC environment"
        notes:
          - "\"operating principals\" is the original wording in v2.0.9 (should be \"principles\")."
        categories:
          a: "Self-certification"
          b: "Self-certification"
          c: "Self-certification"

      - id: HNT4.0
        title: "QoS Policy Acceptance"
        section: "Network"
        level: MUST
        contracting_vehicles:
          - GP IT Futures
          - Tech Innovation
          - DFOCVC
          - Digital Primary Care
        text: >
          The Supplier will have completed a NHS Network QoS Policy review, where the
          Suppliers application makes use of or is accessed across the NHS Network, have
          demonstrated the application and services adhere to the NHS Network policy. NHS
          Network QoS rules may need to be amended as a part of this review. Updates to
          refreshed QoS policies to be applied as required.
        references:
          - "HSCN Quality of Service overview"
        categories:
          a: "Self-certification"
          b: "Self-certification"
          c: "Self-certification"

      - id: HNT40.0
        title: "HSCN Connectivity"
        section: "Network"
        level: MUST
        contracting_vehicles:
          - GP IT Futures
          - Tech Innovation
          - DFOCVC
          - Digital Primary Care
        text: >
          The Supplier to ensure HSCN connectivity is procured where there are any systems
          or services the Supplier needs to reach that are only on the HSCN network.
        notes:
          - "HNT40.0 has no title in the standard itself; the title above is taken from the retained-requirements list."
        categories:
          a: "Self-certification"
          b: "Self-certification"
          c: "Self-certification"

  - id: device-management
    name: "Device Management"
    requirements:

      - id: HDM1.0
        title: "Lights Out Policy"
        section: "Device Management"
        level: MUST
        contracting_vehicles:
          - GP IT Futures
          - DFOCVC
          - Digital Primary Care
        text: >
          The Supplier will provide a 'lights out' operational model for the systems with
          specific processes to allow named engineer access to the environment.
        categories:
          a: "Self-certification"
          b: "Self-certification"
          c: "Self-certification"

      - id: HDM4.0
        title: "Remote Systems Maintenance"
        section: "Device Management"
        level: MUST
        contracting_vehicles:
          - GP IT Futures
          - DFOCVC
          - Digital Primary Care
        text: >
          It will be possible for the Supplier to perform software related maintenance and
          upgrade remotely without requiring physical access to the data hall.
        categories:
          a: "Self-certification"
          b: "Self-certification"
          c: "Self-certification"

editorial_notes:
  - >
    CH1.0 to CH4.0 are not on the retained list. If the cloud data classification, risk
    assessment and DPIA steps are not moving to IG, they disappear, and CH5.0 does not
    replace them. It would also become the only cloud requirement in the standard.
  - >
    ES1.0 and ES2.0 are not on the retained list either. IG's GP-IG-14.2-5 covers data
    location by pointing to the cloud good practice guide, but it has no step requiring
    Authority permission for hosting outside England.
  - >
    HD1.0 is written for data centres. It asks for "data centre design" and "Data Centre
    resilience design". A small wording change to "hosting design (data centre, or cloud
    region and zone)" would make it work for cloud Solutions too.
  - >
    The introduction's hosting options table points to sections that will no longer exist,
    so it needs repointing to CH5.0 and DC1.0.
